<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Golden Pizza offers a wide variety of delicious pizzas made with fresh ingredients and rich flavors. Order now and enjoy the golden taste you love.">
    <title>Golden Pizza</title>
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css"
    rel="stylesheet">
    <link rel="stylesheet" href="../css/mainPage.css">
    <link rel="icon" href="../media/image/logo.png" alt="logo" type="images/icon-x">
</head>
<body>
    <header>
        <div class="page-top">
            <div class="basic">
                <img src="../media/image/logo.png" alt="logo">
                <h4>Golden Pizza</h4>
                <div class="items">
                    <div class="order-now"><a href="#menu">Order Now</a></div>
                    <i class="ri-user-line"></i>
                    <i class="ri-search-line"></i>
                    <i class="ri-menu-line"></i>
                    <select name="language" class="language">
                    <option value="English">English</option>
                    <option value="Arabic">Arabic</option>
                </select>
                </div>
            </div>
        </div>
        <dialog class="userLogin"></dialog>
        <div class="lists hide">
            <nav class="links">
                <a href="#">Home</a>
                <a href="#contact">Contact us</a>
                <a href="#review">Review</a>
                <a href="#menu">Order now</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="promo">
            <video src="../media/video/Pizza_Promo.mov" muted loop autoplay playsinline></video>
        </div>
        <div class="loging">
            <img src="../media/image/logo.png" alt="logo">
        </div>
        <div class="shopping">
            <div class="counter">0</div>
            <i class="ri-shopping-cart-line"></i>
        </div>
        <div class="Menus" id="menu">
            <h2>Our Menu</h2>
            <div class="Menu-list">
            </div>
        </div>
        <div class="comments" id="review">
            <h2>Customer Reviews</h2>
            <div class="comment-list">
                
            </div>
        </div>
    </main>
    <footer>
        <div class="footer-content" id="contact">
            <img src="../media/image/logo.png" alt="logo">
            <div class="contact-info">
                <a href="#contact">Contact us</a>
                <a href="#menu">Order Now</a>
                <a href="#review">Review</a>
            <div class="social-media">
                        <a><i class="ri-instagram-line"></i></a>
                        <a><i class="ri-snapchat-line"></i></a>
                        <a><i class="ri-whatsapp-line"></i></a>
                        <a><i class="ri-tiktok-fill"></i></a>
            </div>
                <div class="contact-me">
                    <p>Email: goldenpizza@example.com</p>
                    <p>Phone: +1234567890</p>
                </div>
                <div class="copyright">
                    <p>&copy; 2024 Golden Pizza. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>
    <script src="../js/main.js" type="module"></script>
</body>
</html>
